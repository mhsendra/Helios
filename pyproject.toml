[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helios"
version = "1.0.0"
description = "Herramienta de análisis, simulación y optimización energética para viviendas con instalaciones fotovoltaicas."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3",
    "numpy>=2.5",
    "numpy-financial>=1.0",
    "matplotlib>=3.10",
    "requests>=2.32",
    "PySide6>=6.9",
    "openpyxl>=3.1",
    "reportlab>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["helios", "helios.*"]
exclude = ["tests", "tests.*"]
